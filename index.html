<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#155b50">
<title>Law Guide</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap');
:root{--green:#155b50;--green2:#1d6a5e;--mint:#eaf1ec;--cream:#f4efe6;--ink:#203b36;--muted:#73817c;--line:#e4e8e3;--white:#fff;--shadow:0 8px 26px rgba(35,58,51,.08)}
*{box-sizing:border-box}html,body{margin:0;background:#dedbd4;font-family:Cairo,Arial,sans-serif;color:var(--ink)}button,input{font:inherit}.phone{max-width:430px;min-height:100vh;margin:auto;background:#fbfbf8;position:relative;overflow:hidden;box-shadow:0 0 40px #0002}.screen{min-height:100vh;padding-bottom:88px}.top{height:68px;background:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 19px;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}.top .brand{font-weight:800;font-size:20px;letter-spacing:.2px}.top button{border:0;background:none;color:var(--ink);font-size:25px;width:40px}.hero{margin:12px;border-radius:26px;min-height:515px;position:relative;overflow:hidden;background:linear-gradient(145deg,#aebfc2 0%,#e8ece8 40%,#d7d9d2 100%);display:flex;align-items:flex-end}.hero:before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,#ffffff12 0%,#174f4630 55%,#0d3f38cc 100%)}.hero:after{content:"";position:absolute;width:170px;height:170px;right:-35px;top:35px;border:2px solid #fff8;border-radius:50%;box-shadow:0 0 0 22px #fff2,0 0 0 44px #fff1}.heroArt{position:absolute;inset:0;opacity:.9;background:linear-gradient(100deg,transparent 0 22%,#dce6e5aa 23% 26%,transparent 27%),linear-gradient(90deg,#ffffffaa 0 2%,transparent 2% 10%,#ffffff88 10% 12%,transparent 12% 18%,#ffffff77 18% 20%,transparent 20%);clip-path:polygon(0 44%,18% 40%,27% 46%,39% 34%,49% 44%,62% 27%,72% 41%,84% 22%,100% 35%,100% 100%,0 100%)}.heroContent{position:relative;z-index:2;color:white;padding:28px 25px 30px;width:100%;text-align:right}.mark{width:72px;height:72px;border-radius:17px;background:#fff;display:grid;place-items:center;margin-bottom:18px;box-shadow:0 8px 20px #0002}.mark svg{width:47px}.hero h1{font-size:39px;line-height:1;margin:0 0 7px;font-weight:800}.hero h2{font-size:16px;margin:0 0 10px;font-weight:700}.hero p{font-size:13px;line-height:1.9;margin:0 0 20px;color:#eef5f1}.primary{border:0;background:var(--green);color:white;border-radius:14px;padding:13px 18px;font-weight:700;box-shadow:0 7px 18px #0d443b35;cursor:pointer}.hero .primary{width:100%;background:#fff;color:var(--green);font-size:15px}.login{display:block;text-align:center;color:white;font-weight:700;margin-top:12px;cursor:pointer}.section{padding:5px 18px}.sectionHead{display:flex;justify-content:space-between;align-items:end;margin:19px 0 11px}.sectionHead h2{margin:0;font-size:18px}.sectionHead span{font-size:11px;color:var(--muted)}.search{background:white;border:1px solid var(--line);height:52px;border-radius:16px;display:flex;align-items:center;gap:9px;padding:0 14px;box-shadow:var(--shadow)}.search input{border:0;outline:0;flex:1;color:var(--ink);font-size:13px}.searchIcon{font-size:20px;color:var(--green)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:15px 13px;min-height:106px;box-shadow:0 4px 15px #263f3810;cursor:pointer}.iconBox{width:40px;height:40px;border-radius:12px;background:var(--mint);display:grid;place-items:center;margin-bottom:9px;color:var(--green)}.iconBox svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.8}.card b{font-size:12px}.card small{display:block;color:var(--muted);font-size:9px;margin-top:3px}.how{background:#f0f4ef;border-radius:17px;padding:15px}.howRow{display:flex;gap:11px;align-items:center;margin:12px 0}.num{width:29px;height:29px;border-radius:50%;background:var(--green);color:white;display:grid;place-items:center;font-size:11px;font-weight:700}.page{padding:17px}.back{border:0;background:none;color:var(--green);font-weight:700;padding:3px 0 12px;cursor:pointer}.page h1{font-size:25px;margin:0 0 4px}.sub{color:var(--muted);font-size:12px;line-height:1.8;margin:0 0 15px}.banner{height:145px;border-radius:20px;position:relative;overflow:hidden;background:linear-gradient(145deg,#b5c9c5,#e5e8e2);margin-bottom:14px}.banner .building{position:absolute;bottom:0;left:8%;right:8%;height:72%;background:repeating-linear-gradient(90deg,#6f8984 0 7%,#dfe5df 7% 10%);clip-path:polygon(0 20%,100% 0,100% 100%,0 100%);opacity:.65}.banner:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,#fff0,#155b5060)}.listCard{background:#fff;border:1px solid var(--line);border-radius:15px;margin:9px 0;padding:13px;display:flex;align-items:center;gap:12px;box-shadow:0 4px 14px #263f3808;cursor:pointer}.listIcon{width:43px;height:43px;border-radius:12px;background:var(--mint);display:grid;place-items:center;color:var(--green)}.listIcon svg{width:23px}.grow{flex:1}.listCard b{font-size:12px}.listCard small{display:block;color:var(--muted);font-size:9px;margin-top:2px}.chev{font-size:19px;color:#8b9994}.steps{display:flex;justify-content:space-between;margin:10px 0 19px;position:relative}.steps:before{content:"";height:2px;background:#dfe6e1;position:absolute;left:8%;right:8%;top:12px}.step{position:relative;z-index:1;text-align:center;font-size:9px;color:#9aa6a1}.stepDot{width:25px;height:25px;background:#e1e8e3;border-radius:50%;display:grid;place-items:center;margin:auto auto 5px;font-size:10px}.step.on{color:var(--green);font-weight:700}.step.on .stepDot{background:var(--green);color:white}.question{background:#eef3ee;border-radius:18px;padding:18px;margin-bottom:12px}.question h2{font-size:16px;margin:0 0 14px}.choice{display:flex;align-items:center;gap:9px;background:white;border:1px solid var(--line);padding:13px;border-radius:13px;margin:8px 0;cursor:pointer}.radio{width:17px;height:17px;border:1px solid #aab7b1;border-radius:50%;display:block}.choice.selected{border-color:var(--green);background:#f5f8f5}.choice.selected .radio{border:5px solid var(--green)}.btnRow{display:flex;gap:9px;margin-top:16px}.btnRow>*{flex:1}.outline{border:1px solid var(--green);background:white;color:var(--green);border-radius:13px;padding:12px;font-weight:700}.docs{background:white;border:1px solid var(--line);border-radius:16px;padding:5px 15px}.doc{display:flex;align-items:center;gap:10px;padding:14px 0;border-bottom:1px solid var(--line);font-size:12px}.doc:last-child{border-bottom:0}.check{width:19px;height:19px;border:1px solid #aebbb5;border-radius:5px;display:grid;place-items:center;color:white}.doc.done .check{background:var(--green);border-color:var(--green)}.note{background:#f7f0e5;border-radius:13px;padding:12px;font-size:10px;line-height:1.8;margin-top:11px}.timeline{background:white;border:1px solid var(--line);border-radius:17px;padding:15px}.tl{display:flex;gap:12px;position:relative;padding-bottom:17px}.tl:last-child{padding-bottom:0}.tl:not(:last-child):before{content:"";position:absolute;right:11px;top:27px;bottom:0;width:2px;background:#dce5df}.tlDot{width:25px;height:25px;border-radius:50%;background:#e5ebe7;color:var(--muted);display:grid;place-items:center;font-size:10px;z-index:1}.tl.done .tlDot{background:var(--green);color:white}.tl b{font-size:11px}.tl small{display:block;color:var(--muted);font-size:9px}.status{background:#edf4ef;border-radius:15px;padding:14px;margin-top:11px}.source{background:white;border:1px solid var(--line);border-radius:16px;padding:15px;margin-top:11px}.source h3{font-size:14px;margin:0 0 8px}.source p{font-size:10px;line-height:1.9;color:var(--muted);margin:0}.bottom{position:fixed;bottom:0;width:min(100%,430px);height:75px;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:space-around;align-items:center;z-index:9}.bottom button{border:0;background:none;color:#87938f;font-size:20px;min-width:65px;cursor:pointer}.bottom button.active{color:var(--green)}.bottom small{display:block;font-size:9px;margin-top:2px}.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#203b36;color:white;padding:9px 15px;border-radius:12px;font-size:11px;opacity:0;z-index:20;transition:.2s}.toast.show{opacity:1}
</style></head>
<body>
<div class="phone" id="app"></div>
<div class="toast" id="toast"></div>
<script>
const icons={
home:`<svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5M9 21v-6h6v6"/></svg>`,
building:`<svg viewBox="0 0 24 24"><path d="M4 21V5l8-2v18M12 21h8V8l-8-2M7 8h2M7 12h2M7 16h2M15 11h2M15 15h2M15 19h2"/></svg>`,
doc:`<svg viewBox="0 0 24 24"><path d="M6 3h9l4 4v14H6zM15 3v5h5M9 12h6M9 16h6"/></svg>`,
work:`<svg viewBox="0 0 24 24"><path d="M4 8h16v12H4zM8 8V5h8v3M2 13h20"/></svg>`,
people:`<svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3"/><circle cx="17" cy="9" r="2.5"/><path d="M3 20c.5-4 3-6 6-6s5.5 2 6 6M14 15c3.5-.5 6 1.5 7 5"/></svg>`,
contract:`<svg viewBox="0 0 24 24"><path d="M6 3h9l4 4v14H6zM15 3v5h5M9 13h6M9 17h4"/></svg>`,
gavel:`<svg viewBox="0 0 24 24"><path d="m14 4 6 6M12 6l6 6M8 10l6 6M4 20l9-9M3 21h8"/></svg>`,
map:`<svg viewBox="0 0 24 24"><path d="m3 6 6-3 6 3 6-3v15l-6 3-6-3-6 3zM9 3v15M15 6v15"/></svg>`,
user:`<svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-5 4-7 8-7s7 2 8 7"/></svg>`,
heart:`<svg viewBox="0 0 24 24"><path d="M20 12c0 5-8 9-8 9S4 17 4 12a4 4 0 0 1 8-2 4 4 0 0 1 8 2Z"/></svg>`
};
const categories=[
["العقار والتعمير","إجراءات العقار والبناء",icons.home,0],
["إنشاء مؤسسة","إنشاء ومتابعة المؤسسات",icons.building,1],
["الوثائق الإدارية","وثائق وخدمات إدارية",icons.doc,2],
["العمل والتوظيف","إجراءات العمل والتوظيف",icons.work,3],
["الأحوال الشخصية","إجراءات الأسرة والحالة المدنية",icons.people,4],
["العقود","العقود والإجراءات المرتبطة بها",icons.contract,5],
["الطعون والنزاعات","إجراءات الطعن والتظلم",icons.gavel,6],
["أخرى","مجالات وإجراءات أخرى",icons.map,7]
];
function toast(t){let x=document.getElementById("toast");x.textContent=t;x.classList.add("show");setTimeout(()=>x.classList.remove("show"),1500)}
function bottom(active="home"){return `<nav class="bottom"><button class="${active=="home"?"active":""}" onclick="home()">${icons.home}<small>الرئيسية</small></button><button class="${active=="saved"?"active":""}" onclick="saved()">${icons.heart}<small>محفوظاتي</small></button><button class="${active=="cases"?"active":""}" onclick="cases()">${icons.doc}<small>إجراءاتي</small></button><button class="${active=="profile"?"active":""}" onclick="profile()">${icons.user}<small>حسابي</small></button></nav>`}
function top(){return `<header class="top"><button onclick="toast('القائمة')">☰</button><div class="brand">Law Guide</div><button onclick="search()">⌕</button></header>`}
function home(){
document.getElementById("app").innerHTML=`<div class="screen">${top()}
<section class="hero"><div class="heroArt"></div><div class="heroContent">
<div class="mark"><svg viewBox="0 0 60 60"><rect x="9" y="8" width="28" height="40" rx="4" fill="#155b50"/><path d="M16 18h15M16 25h15M16 32h10" stroke="white" stroke-width="3" stroke-linecap="round"/><path d="M43 12v29M36 12h14M39 41c0 7 9 7 9 0M43 12l-7 16h14z" fill="none" stroke="#155b50" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
<h1>Law Guide</h1><h2>اعرف خطوتك القانونية.</h2><p>منصة تساعدك على فهم الإجراءات القانونية والإدارية بطريقة بسيطة، واضحة ومنظمة.</p>
<button class="primary" onclick="categoriesPage()">ابدأ الآن <span>←</span></button><div class="login" onclick="profile()">تسجيل الدخول</div></div></section>
<section class="section"><div class="sectionHead"><h2>ابحث عن إجراء</h2></div><div class="search" onclick="search()"><span class="searchIcon">⌕</span><input placeholder="ما هو الإجراء الذي تبحث عنه؟" readonly></div>
<div class="sectionHead"><h2>الأكثر استعمالًا</h2><span>عرض الكل</span></div><div class="grid">${categories.slice(0,6).map(c=>`<div class="card" onclick="category(${c[3]})"><div class="iconBox">${c[2]}</div><b>${c[0]}</b><small>${c[1]}</small></div>`).join("")}</div>
<div class="sectionHead"><h2>كيف يعمل Law Guide؟</h2></div><div class="how"><div class="howRow"><span class="num">1</span><b>اختر الإجراء</b></div><div class="howRow"><span class="num">2</span><b>اكتشف الوثائق والخطوات</b></div><div class="howRow"><span class="num">3</span><b>تابع تقدمك حتى النهاية</b></div></div></section></div>${bottom()}`}

function categoriesPage(){document.getElementById("app").innerHTML=`<div class="screen">${top()}<main class="page"><button class="back" onclick="home()">‹ العودة</button><h1>اختر المجال</h1><p class="sub">ما الذي تريد القيام به؟ اختر المجال الأقرب لإجراءك.</p><div class="grid">${categories.map(c=>`<div class="card" onclick="category(${c[3]})"><div class="iconBox">${c[2]}</div><b>${c[0]}</b><small>${c[1]}</small></div>`).join("")}</div></main></div>${bottom()}`}
function category(i){
if(i!==0){toast("سيتم إضافة هذا المجال بالمصادر الرسمية");return}
document.getElementById("app").innerHTML=`<div class="screen">${top()}<main class="page"><button class="back" onclick="categoriesPage()">‹ العودة</button><div class="banner"><div class="building"></div></div><h1>العقار والتعمير</h1><p class="sub">كل ما يتعلق بالإجراءات العقارية والتعمير في مكان واحد.</p>
${[
["رخصة البناء","الحصول على رخصة بناء لمشروعك",icons.home],
["شهادة التعمير","الحصول على شهادة التعمير",icons.doc],
["التقسيم العقاري","إجراءات التقسيم والتهيئة",icons.map],
["الملكية العقارية","تسجيل ونقل الملكية",icons.home],
["عقود الكراء","كل ما يتعلق بعقود الإيجار",icons.contract]
].map((x,i)=>`<div class="listCard" onclick="${i==0?"questions()":"toast('سيضاف بالمصادر الرسمية')"}"><div class="listIcon">${x[2]}</div><div class="grow"><b>${x[0]}</b><small>${x[1]}</small></div><span class="chev">‹</span></div>`).join("")}</main></div>${bottom()}`}
function steps(n){return `<div class="steps">${["الأسئلة","الوثائق","المراحل","المصدر"].map((x,i)=>`<div class="step ${i<=n?"on":""}"><div class="stepDot">${i+1}</div>${x}</div>`).join("")}</div>`}
function questions(){
document.getElementById("app").innerHTML=`<div class="screen">${top()}<main class="page"><button class="back" onclick="category(0)">‹ العودة</button>${steps(0)}<h1>رخصة البناء</h1><p class="sub">أجب عن الأسئلة التالية حتى نحدد لك المسار المناسب.</p><div class="question"><h2>هل أنت مالك العقار؟</h2><div class="choice selected" onclick="selectChoice(this)"><span class="radio"></span><b>نعم، أنا مالك العقار</b></div><div class="choice" onclick="selectChoice(this)"><span class="radio"></span><b>لا، أمثل المالك</b></div></div><div class="question"><h2>ما طبيعة المشروع؟</h2><div class="choice" onclick="selectChoice(this)"><span class="radio"></span><b>بناء جديد</b></div><div class="choice" onclick="selectChoice(this)"><span class="radio"></span><b>توسعة أو تعديل</b></div></div><div class="btnRow"><button class="primary" onclick="documents()">التالي ←</button></div></main></div>${bottom()}`}
function selectChoice(el){el.parentNode.querySelectorAll(".choice").forEach(x=>x.classList.remove("selected"));el.classList.add("selected")}
function documents(){
let ds=["طلب رخصة البناء","وثيقة الملكية","مخطط الموقع","المخطط التقني للمشروع","شهادة مطابقة أو وثائق إضافية حسب الحالة"];
document.getElementById("app").innerHTML=`<div class="screen">${top()}<main class="page"><button class="back" onclick="questions()">‹ العودة</button>${steps(1)}<h1>الوثائق المطلوبة</h1><p class="sub">ضع علامة ✓ أمام كل وثيقة قمت بتحضيرها.</p><div class="docs">${ds.map((d,i)=>`<div class="doc" onclick="this.classList.toggle('done');this.querySelector('.check').textContent=this.classList.contains('done')?'✓':''"><span class="check"></span><span>${d}</span></div>`).join("")}</div><div class="note">يمكن أن تختلف الوثائق المطلوبة حسب طبيعة المشروع وموقعه. يجب التحقق من القائمة النهائية لدى الجهة المختصة.</div><div class="btnRow"><button class="outline" onclick="questions()">السابق</button><button class="primary" onclick="timeline()">التالي ←</button></div></main></div>${bottom()}`}
function timeline(){
document.getElementById("app").innerHTML=`<div class="screen">${top()}<main class="page"><button class="back" onclick="documents()">‹ العودة</button>${steps(2)}<h1>متابعة الإجراء</h1><p class="sub">خريطة الطريق الخاصة بطلبك.</p><div class="status"><b>حالة الملف: قيد التحضير</b><br><small>يمكنك متابعة كل مرحلة من هنا.</small></div><div class="timeline" style="margin-top:12px">${["تحضير الوثائق","إيداع الملف لدى الجهة المختصة","دراسة الملف","استلام القرار"].map((x,i)=>`<div class="tl ${i==0?"done":""}"><div class="tlDot">${i==0?"✓":i+1}</div><div><b>${x}</b><small>${i==0?"تمت":i==1?"الخطوة التالية":"بانتظار إتمام المرحلة السابقة"}</small></div></div>`).join("")}</div><div class="source"><h3>رقم متابعة الملف</h3><p style="font-size:16px;color:var(--ink);font-weight:700">RP-2026-4587</p></div><button class="primary" style="width:100%;margin-top:12px" onclick="legal()">الأساس القانوني ←</button></main></div>${bottom()}`}
function legal(){
document.getElementById("app").innerHTML=`<div class="screen">${top()}<main class="page"><button class="back" onclick="timeline()">‹ العودة</button>${steps(3)}<h1>الأساس القانوني</h1><p class="sub">المراجع القانونية والتنظيمية المرتبطة بهذا الإجراء.</p><div class="source"><h3>الأساس القانوني</h3><p>تظهر هنا النصوص القانونية والتنظيمية المعتمدة بعد التحقق منها من المصادر الرسمية، مع بيان المادة أو النص المرتبط بكل خطوة.</p><button class="outline" style="margin-top:12px;width:100%" onclick="toast('سيُربط بالمصدر الرسمي')">عرض النصوص القانونية ↗</button></div><div class="source"><h3>آخر تحديث</h3><p>12 أكتوبر 2026</p><p>تمت مراجعة المعلومات والوثائق المرتبطة بالإجراء.</p></div><div class="note">Law Guide يقدم معلومات وتوجيهًا عامًا حول الإجراءات، ولا يستبدل الاستشارة القانونية المهنية.</div><button class="primary" style="width:100%;margin-top:12px" onclick="localStorage.lgSaved=1;toast('تم حفظ الإجراء ✓')">♡ حفظ الإجراء</button></main></div>${bottom()}`}
function saved(){document.getElementById("app").innerHTML=`<div class="screen">${top()}<main class="page"><h1>محفوظاتي</h1><p class="sub">الإجراءات التي حفظتها للعودة إليها لاحقًا.</p>${localStorage.lgSaved?`<div class="listCard" onclick="legal()"><div class="listIcon">${icons.home}</div><div class="grow"><b>رخصة البناء</b><small>العقار والتعمير</small></div>‹</div>`:`<div class="source" style="text-align:center;padding:35px">لا توجد إجراءات محفوظة بعد.</div>`}</main></div>${bottom("saved")}`}
function cases(){timeline()}
function profile(){document.getElementById("app").innerHTML=`<div class="screen">${top()}<main class="page"><h1>حسابي</h1><p class="sub">إدارة حسابك وتفضيلاتك.</p><div class="listCard"><div class="listIcon">${icons.user}</div><div class="grow"><b>البيانات الشخصية</b><small>الاسم وبيانات التواصل</small></div>‹</div><div class="listCard"><div class="listIcon">${icons.doc}</div><div class="grow"><b>إجراءاتي المحفوظة</b><small>الوصول السريع للملفات</small></div>‹</div><div class="listCard"><div class="listIcon">${icons.map}</div><div class="grow"><b>الموقع والجهة المختصة</b><small>تخصيص النتائج حسب منطقتك</small></div>‹</div></main></div>${bottom("profile")}`}
